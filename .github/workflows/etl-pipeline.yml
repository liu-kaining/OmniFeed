# OmniFeed ETL Pipeline
#
# Runs every 2 hours. All secrets documented in config/README.md

name: OmniFeed ETL Pipeline

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no R2 writes)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/etl-pipeline.yml'

concurrency:
  group: etl-pipeline
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  etl:
    name: Run ETL Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL pipeline
        env:
          # --- Required secrets (see config/README.md) ---
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # --- Optional secrets ---
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}
          LLM_MODE: ${{ secrets.LLM_MODE }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_CHUNK_SIZE: ${{ secrets.LLM_CHUNK_SIZE }}
          LLM_MAX_FAILURES: ${{ secrets.LLM_MAX_FAILURES }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          ETL_DAYS_BACK: ${{ secrets.ETL_DAYS_BACK }}
          ETL_MAX_FEED_ITEMS: ${{ secrets.ETL_MAX_FEED_ITEMS }}
          FMP_BASE_URL: ${{ secrets.FMP_BASE_URL }}
          FMP_INSIDER_LIMIT: ${{ secrets.FMP_INSIDER_LIMIT }}
          FMP_NEWS_LIMIT: ${{ secrets.FMP_NEWS_LIMIT }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run && 'true' || 'false' }}
        run: python -m src.main

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-logs-${{ github.run_id }}
          path: |
            *.log
            logs/
          retention-days: 7

# OmniFeed Frontend Deployment
#
# Generates frontend/config.js from secrets, then deploys to Cloudflare Pages.
# All secrets documented in config/README.md

name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'config/**'
      - 'scripts/generate_frontend_config.py'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Generate frontend config
        env:
          OMNIFEED_API_BASE: ${{ secrets.OMNIFEED_API_BASE }}
          OMNIFEED_FEEDS_BASE: ${{ secrets.OMNIFEED_FEEDS_BASE }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: python scripts/generate_frontend_config.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/ --project-name=omnifeed
